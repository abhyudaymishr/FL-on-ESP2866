[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pifl-vis"
version = "1.0.0"
authors = [
  { name="PIFL Authors", email="authors@example.com" },
]
description = "Physics-Informed Federated Learning Python Visualization Server"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
pifl-dashboard = "pifl_vis.server:main"

[tool.setuptools]
packages = ["pifl_vis"]
