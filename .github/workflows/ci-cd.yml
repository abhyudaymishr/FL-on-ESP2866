name: PIFL CI and Cloudflare deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated current main branch
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pifl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Native, protocol, Python and bridge regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m unittest discover tests -v
        env:
          PIFL_SANITIZE: '1'
          CXX: g++
  firmware:
    name: ESP8266 firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.1.18
      - run: pio run -e nodemcuv2
      - uses: actions/upload-artifact@v4
        with:
          name: esp8266-firmware-${{ github.sha }}
          include-hidden-files: true
          path: |
            .pio/build/nodemcuv2/firmware.bin
            .pio/build/nodemcuv2/firmware.elf
          if-no-files-found: error
          retention-days: 7
  console:
    name: Domain, SQL, API and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run deploy -- --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  deploy:
    name: Deploy and verify Cloudflare release
    needs: [native, firmware, console]
    if: vars.PIFL_DEPLOY_PROVIDER == 'github-actions' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PIFL_GATEWAY_KEYS: ${{ secrets.PIFL_GATEWAY_KEYS }}
      PIFL_READ_TOKEN: ${{ secrets.PIFL_READ_TOKEN }}
      PIFL_WORKER_NAME: ${{ vars.PIFL_WORKER_NAME || 'fl-on-esp2866' }}
      PIFL_D1_DATABASE_ID: ${{ vars.PIFL_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-release-${{ github.sha }}
          path: dist/
      - name: Deploy the tested artifact
        id: release
        run: npm run deploy
      - name: Verify release, authentication and UI
        id: smoke
        run: npm run smoke
        env:
          PIFL_CLOUD_URL: ${{ steps.release.outputs.url }}
      - name: Restore previous code if smoke checks fail
        if: failure() && steps.release.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: node scripts/rollback.mjs --previous
